base: ../experiment-base.yaml
output_dir: runs/decision-sprint
max_eur: 0.72
runs:
- name: size-15m
  overrides:
    model:
      backbone: dit
      hidden_size: 256
      heads: 8
      conditioning: pooled
      ffn: swiglu
      attention: full
      efficiency: dense
    train:
      batch_size: 768
      effective_batch_size: 768
- name: dense-30m-control
  overrides:
    model:
      backbone: dit
      hidden_size: 360
      heads: 8
      conditioning: pooled
      ffn: swiglu
      attention: full
      efficiency: dense
    train:
      batch_size: 384
      effective_batch_size: 768
- name: size-48m
  overrides:
    model:
      backbone: dit
      hidden_size: 456
      heads: 8
      conditioning: pooled
      ffn: swiglu
      attention: full
      efficiency: dense
    train:
      batch_size: 384
      effective_batch_size: 768
- name: microdit-30m-matched
  overrides:
    model:
      backbone: dit
      hidden_size: 344
      heads: 8
      conditioning: pooled
      ffn: swiglu
      attention: full
      efficiency: microdit
      mask_ratio: 0.5
      mask_finish_ratio: 0.1
    train:
      batch_size: 768
      effective_batch_size: 768
- name: moe-30m-matched
  overrides:
    model:
      backbone: dit
      hidden_size: 280
      heads: 8
      conditioning: pooled
      ffn: moe
      attention: full
      efficiency: moe
      num_experts: 4
    train:
      batch_size: 768
      effective_batch_size: 768
- name: token-cross-attention-30m
  overrides:
    model:
      backbone: dit
      hidden_size: 320
      heads: 8
      conditioning: cross
      ffn: swiglu
      attention: full
      efficiency: dense
    train:
      batch_size: 384
      effective_batch_size: 768

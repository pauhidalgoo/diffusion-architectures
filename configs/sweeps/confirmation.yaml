base: ../experiment-base.yaml
output_dir: runs/confirmatory
max_eur: 0.36
runs:
- name: finalist-a-seed-101
  overrides:
    model:
      backbone: dit
      in_channels: 32
      hidden_size: 360
      depth: 12
      heads: 8
      patch_size: 1
      mlp_ratio: 4.0
      text_dim: 512
      text_length: 77
      dropout: 0.0
      conditioning: pooled
      ffn: swiglu
      attention: full
      efficiency: dense
      mask_ratio: 0.5
      mask_finish_ratio: 0.1
      window_size: 8
      num_experts: 4
      repa_dim: 384
      max_parameters: 50000000
    objective:

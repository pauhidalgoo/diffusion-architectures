base: ../experiment-base.yaml
output_dir: runs/exploratory/conditioning
max_eur: 0.45
runs:
  - name: pooled-adaln
    overrides:
      model:
        backbone: pixart
        conditioning: pooled
        hidden_size: 360
      train:
        batch_size: 384
        effective_batch_size: 768
  - name: token-cross-attention
    overrides:
      model:
        backbone: pixart
        conditioning: cross
        hidden_size: 320
      train:
        batch_size: 768
        effective_batch_size: 768
  - name: joint-attention
    overrides:
      model:
        backbone: pixart
        conditioning: joint
        hidden_size: 360
      train:
        batch_size: 192
        effective_batch_size: 768
